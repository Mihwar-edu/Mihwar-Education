<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دروس الأستاذة أميرة شنوف - أكاديمية مشكاة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
<script>
try{if(localStorage.getItem('mishkat_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}
</script>
<style>
:root{--blue:#0a84ff;--ink:#101828;--muted:#667085;--card:#fff;--line:#eaeef3;--bgfrom:#e3f4ff;--bgmid:#f4fbff;--bgto:#fffbea;--shadow:rgba(10,132,255,.12);color-scheme:light;
--c1:#0a7ba0;--c2:#0f9bbd;--gold1:#ffc233;--gold2:#ff9f1c;--goldink:#4a3000;--cglow:rgba(6,120,150,.38);--cdeep:#086a8c}
:root[data-theme="dark"]{--ink:#f2f5f8;--muted:#9aa7b6;--card:#16212d;--line:#223041;--bgfrom:#0f2438;--bgmid:#0d141c;--bgto:#0d141c;--shadow:rgba(0,0,0,.35);color-scheme:dark}
body{display:block;padding:40px 5%;min-height:100vh;background:linear-gradient(135deg,var(--bgfrom),var(--bgmid) 60%,var(--bgto));color:var(--ink)}
.wrap{max-width:640px;margin:0 auto;text-align:center}
.logo,h1{color:var(--ink)}
h1{font-size:30px;margin-bottom:6px}
.sub{color:var(--muted)}

/* بطاقات الفيديوهات: بطاقتان في كل صف، والأخيرة تتوسط */
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:26px auto 0;max-width:640px}
.lgrid .lc:last-child:nth-child(odd){grid-column:1/-1;justify-self:center;width:calc(50% - 6px)}
.lc{display:flex;flex-direction:column;align-items:center;direction:rtl;text-align:center;padding:14px 10px 16px;border-radius:18px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 12px 28px var(--cglow);transition:transform .25s;text-decoration:none}
.lc:hover,.lc:focus-visible{transform:translateY(-4px)}
.lc::before{content:"";position:absolute;left:-40px;bottom:-60px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.12)}
.lc>*{position:relative}
.lc-n{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--gold1),var(--gold2));color:var(--goldink);font-weight:800;font-size:14px;display:grid;place-items:center;box-shadow:0 6px 14px rgba(255,159,28,.4)}
.lc-ico{width:46px;height:46px;margin:10px auto 8px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center}
.lc-ico svg{width:22px;height:22px;fill:#fff;stroke:none}
.lc-t{flex:1;font-size:13px;font-weight:800;line-height:1.55;margin-bottom:12px;text-shadow:0 1px 2px rgba(0,60,80,.25)}
.lc-go{display:inline-block;background:#fff;color:var(--cdeep);padding:7px 14px;border-radius:999px;font-size:12px;font-weight:800;box-shadow:0 8px 18px rgba(0,60,80,.2)}
.empty{margin-top:30px;color:var(--muted);font-weight:700}
@media (min-width:600px){
  .lgrid{gap:18px}
  .lgrid .lc:last-child:nth-child(odd){width:calc(50% - 9px)}
  .lc{padding:20px 18px 22px;border-radius:20px}
  .lc-n{width:34px;height:34px;font-size:15px}
  .lc-ico{width:56px;height:56px}
  .lc-ico svg{width:26px;height:26px}
  .lc-t{font-size:15px}
  .lc-go{padding:9px 24px;font-size:14px}
}

.bar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:30px}
.back,.mode{display:inline-block;width:auto;margin:0;padding:8px 20px;border:1.5px solid var(--blue);border-radius:999px;background:var(--card);color:var(--blue);font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.back:hover,.back:focus-visible,.mode:hover,.mode:focus-visible{background:var(--blue);color:#fff}
.mock{background:var(--card);border-radius:16px;padding:24px;margin:34px auto 0;max-width:420px;box-shadow:0 20px 50px var(--shadow)}
.mock .l{height:10px;border-radius:6px;background:var(--line);margin-bottom:12px}
.mock .g{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.mock .g div{height:110px;border-radius:12px}
.mock .g div:nth-child(1){background:#fff7d6}
.mock .g div:nth-child(2){background:#dff6ff}
.mock .g div:nth-child(3){background:#dcebff}
@media (prefers-reduced-motion:reduce){.lc{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">أكاديمية مشكاة</div>
  <h1 id="ttl">الفيزياء</h1>
  <p class="sub" id="br">دروس الأستاذة أميرة شنوف</p>

  <div class="lgrid" id="lgrid"></div>
  <p class="empty" id="empty" hidden>لا توجد فيديوهات لهذا الدرس بعد، وستُضاف قريباً ✨</p>

  <div class="bar">
    <a class="back" href="index.html">← العودة للرئيسية</a>
    <button class="mode" id="mode" type="button">🌙 الوضع الليلي</button>
  </div>

  <div class="mock" aria-hidden="true">
    <div class="l" style="width:70%"></div>
    <div class="l"></div>
    <div class="l" style="width:85%"></div>
    <div class="g"><div></div><div></div><div></div></div>
  </div>
</div>

<script src="physlinks.js"></script>
<script>
const root=document.documentElement, modeBtn=document.getElementById('mode');
function paint(){
  modeBtn.textContent=root.getAttribute('data-theme')==='dark'?'☀️ الوضع النهاري':'🌙 الوضع الليلي';
}
paint();
modeBtn.onclick=()=>{
  const dark=root.getAttribute('data-theme')==='dark';
  if(dark){root.removeAttribute('data-theme');}else{root.setAttribute('data-theme','dark');}
  try{localStorage.setItem('mishkat_theme',dark?'light':'dark');}catch(e){}
  paint();
};

const ch=localStorage.getItem('mishkat_chapter')||'';
const br=localStorage.getItem('mishkat_branch')||'';
const title=ch||'الفيزياء';
document.getElementById('ttl').textContent=title;
document.title=title+' - أكاديمية مشكاة';
let sub='الأستاذة أميرة شنوف';
if(br) sub+=' • شعبة '+br;
document.getElementById('br').textContent=sub;

const list=(typeof PHYS_LINKS!=='undefined'&&PHYS_LINKS[ch])||[];
const grid=document.getElementById('lgrid');
if(!list.length){
  document.getElementById('empty').hidden=false;
}else{
  list.forEach((it,i)=>{
    const a=document.createElement('a');
    a.className='lc';
    a.href=it.u;
    a.target='_blank';
    a.rel='noopener';

    const n=document.createElement('span');
    n.className='lc-n';
    n.textContent=String(i+1);

    const ico=document.createElement('div');
    ico.className='lc-ico';
    ico.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z"/></svg>';

    const t=document.createElement('div');
    t.className='lc-t';
    t.textContent=it.t;

    const go=document.createElement('span');
    go.className='lc-go';
    go.textContent='شاهد الآن ←';

    a.appendChild(n);
    a.appendChild(ico);
    a.appendChild(t);
    a.appendChild(go);
    grid.appendChild(a);
  });
}
</script>
<script src="about.js"></script>
</body>
</html>
