<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مادة العلوم - أكاديمية مشكاة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
<script>
try{if(localStorage.getItem('mishkat_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}
</script>
<style>
:root{--blue:#0a84ff;--ink:#101828;--muted:#667085;--card:#fff;--line:#eaeef3;--bgfrom:#e3f4ff;--bgmid:#f4fbff;--bgto:#fffbea;--shadow:rgba(10,132,255,.12);color-scheme:light}
:root[data-theme="dark"]{--ink:#f2f5f8;--muted:#9aa7b6;--card:#16212d;--line:#223041;--bgfrom:#0f2438;--bgmid:#0d141c;--bgto:#0d141c;--shadow:rgba(0,0,0,.35);color-scheme:dark}
body{display:block;padding:40px 5%;min-height:100vh;background:linear-gradient(135deg,var(--bgfrom),var(--bgmid) 60%,var(--bgto));color:var(--ink)}
.wrap{max-width:640px;margin:0 auto;text-align:center}
.logo,h1{color:var(--ink)}
h1{font-size:30px;margin-bottom:6px}
.sub{color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:28px}
.b{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:26px 10px;font:inherit;font-size:17px;font-weight:800;line-height:1.5;color:var(--ink);cursor:pointer;width:100%;margin:0;transition:.15s;box-shadow:0 10px 30px var(--shadow)}
.b:hover,.b:focus-visible{border-color:var(--blue);transform:translateY(-3px)}
.b:last-child:nth-child(odd){grid-column:1/-1}
.b span{display:block;font-size:30px;line-height:42px;height:42px;margin-bottom:8px}
.b span svg{width:42px;height:42px;vertical-align:middle}
.bar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:28px}
.back,.mode{display:inline-block;width:auto;margin:0;padding:8px 20px;border:1.5px solid var(--blue);border-radius:999px;background:var(--card);color:var(--blue);font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.back:hover,.back:focus-visible,.mode:hover,.mode:focus-visible{background:var(--blue);color:#fff}
.mock{background:var(--card);border-radius:16px;padding:24px;margin:34px auto 0;max-width:420px;box-shadow:0 20px 50px var(--shadow)}
.mock .l{height:10px;border-radius:6px;background:var(--line);margin-bottom:12px}
.mock .g{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.mock .g div{height:110px;border-radius:12px}
.mock .g div:nth-child(1){background:#fff7d6}
.mock .g div:nth-child(2){background:#dff6ff}
.mock .g div:nth-child(3){background:#dcebff}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">أكاديمية مشكاة</div>
  <h1>مادة العلوم</h1>
  <p class="sub" id="br">اختر الدرس الذي تريده</p>

  <div class="grid" id="grid"></div>

  <div class="bar">
    <a class="back" href="index.html">← العودة للرئيسية</a>
    <button class="mode" id="mode" type="button">🌙 الوضع الليلي</button>
  </div>

  <div class="mock" aria-hidden="true">
    <div class="l" style="width:70%"></div>
    <div class="l"></div>
    <div class="l" style="width:85%"></div>
    <div class="g"><div></div><div></div><div></div></div>
  </div>
</div>
<script>
const root=document.documentElement, modeBtn=document.getElementById('mode');
function paint(){
  modeBtn.textContent=root.getAttribute('data-theme')==='dark'?'☀️ الوضع النهاري':'🌙 الوضع الليلي';
}
paint();
modeBtn.onclick=()=>{
  const dark=root.getAttribute('data-theme')==='dark';
  if(dark){root.removeAttribute('data-theme');}else{root.setAttribute('data-theme','dark');}
  try{localStorage.setItem('mishkat_theme',dark?'light':'dark');}catch(e){}
  paint();
};

const br=localStorage.getItem('mishkat_branch')||'';
if(br) document.getElementById('br').textContent='شعبة '+br;

/* رسومات علمية:
   ADN = حلزون مزدوج بأزواج قواعد (تركيب البروتين)
   إنزيم E وركيزة S (التحفيز الإنزيمي)
   خلية عصبية وكمون عمل (الاتصال العصبي)
   ميتوكوندري وطاقة (التنفس) */
const SVG_DNA='<svg viewBox="0 0 40 40" aria-hidden="true"><g stroke-width="2.2" stroke-linecap="round"><path d="M13.8 8.3H20" stroke="#e53e3e"/><path d="M20 8.3H26.2" stroke="#22a559"/><path d="M13.8 15.2H20" stroke="#22a559"/><path d="M20 15.2H26.2" stroke="#e53e3e"/><path d="M13.8 24.8H20" stroke="#f59e0b"/><path d="M20 24.8H26.2" stroke="#7c4dff"/><path d="M13.8 31.7H20" stroke="#7c4dff"/><path d="M20 31.7H26.2" stroke="#f59e0b"/></g><g fill="none" stroke-width="3" stroke-linecap="round"><path d="M11 3C11 12 29 12 29 20C29 28 11 28 11 37" stroke="#0f9bbd"/><path d="M29 3C29 12 11 12 11 20C11 28 29 28 29 37" stroke="#1d57d6"/></g></svg>';

const SVG_ENZ='<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M5 36V24a7 7 0 0 1 7-7h5l7 7 7-7h5a7 7 0 0 1 7 7v12a6 6 0 0 1-6 6H11a6 6 0 0 1-6-6Z" fill="#8ed6ef" stroke="#0a7ba0" stroke-width="2.4" stroke-linejoin="round"/><path d="M14 5h20l-10 17Z" fill="#ffb347" stroke="#d9480f" stroke-width="2.4" stroke-linejoin="round"/><text x="24" y="37" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="800" fill="#08566e">E</text><text x="24" y="14.5" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" font-weight="800" fill="#7a2e00">S</text></svg>';

const SVG_NEU='<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M7 15L3 10M6.5 25L3 30M11 14L10 7M10 26L11 33" fill="none" stroke="#7c4dff" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="20" r="6" fill="#d9c2ff" stroke="#7c4dff" stroke-width="2"/><circle cx="12" cy="20" r="2" fill="#7c4dff"/><path d="M18 20H34" stroke="#7c4dff" stroke-width="2.5" stroke-linecap="round"/><path d="M22 20L24 10L27 30L29 20" fill="none" stroke="#ff9f1c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="36" cy="20" r="2.8" fill="#ffc233" stroke="#e8a300" stroke-width="1.2"/></svg>';

const SVG_RESP='<svg viewBox="0 0 40 40" aria-hidden="true"><g transform="rotate(-15 20 25)"><ellipse cx="20" cy="25" rx="16" ry="9.5" fill="#ffd0b8" stroke="#e2672b" stroke-width="2"/><path d="M8 25q2.6-7.5 5.2 0t5.2 0t5.2 0t5.2 0t5.2 0" fill="none" stroke="#c2410c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M31 2L24 12.5H29L26 21L35 10H30L33 2Z" fill="#ffc233" stroke="#e8a300" stroke-width="1" stroke-linejoin="round"/></svg>';

const ALL=[
  {n:'تركيب البروتين',svg:SVG_DNA},
  {n:'العلاقة بين البنية والوظيفة',e:'🧩'},
  {n:'دور البروتينات في التحفيز الإنزيمي',svg:SVG_ENZ},
  {n:'المناعة',e:'🛡️'},
  {n:'الاتصال العصبي',svg:SVG_NEU},
  {n:'التركيب الضوئي',e:'🌿'},
  {n:'التنفس',svg:SVG_RESP}
];
const M3=['تركيب البروتين','العلاقة بين البنية والوظيفة','المناعة'];
const list=(br==='رياضيات')?ALL.filter(x=>M3.indexOf(x.n)>-1):ALL;

const grid=document.getElementById('grid');
list.forEach(x=>{
  const b=document.createElement('button');
  b.type='button';
  b.className='b';
  b.dataset.c=x.n;
  const s=document.createElement('span');
  if(x.svg){s.innerHTML=x.svg;}else{s.textContent=x.e;}
  b.appendChild(s);
  b.appendChild(document.createTextNode(x.n));
  b.onclick=()=>{
    localStorage.setItem('mishkat_chapter',x.n);
    location.href='lesson.html';
  };
  grid.appendChild(b);
});
</script>
<script src="about.js"></script>
</body>
</html>
