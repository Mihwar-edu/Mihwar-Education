<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الدرس - أكاديمية مشكاة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
<script>
try{if(localStorage.getItem('mishkat_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}
</script>
<style>
:root{--blue:#0a84ff;--ink:#101828;--muted:#667085;--card:#fff;--line:#eaeef3;--bgfrom:#e3f4ff;--bgmid:#f4fbff;--bgto:#fffbea;--shadow:rgba(10,132,255,.12);color-scheme:light}
:root[data-theme="dark"]{--ink:#f2f5f8;--muted:#9aa7b6;--card:#16212d;--line:#223041;--bgfrom:#0f2438;--bgmid:#0d141c;--bgto:#0d141c;--shadow:rgba(0,0,0,.35);color-scheme:dark}
body{display:block;padding:40px 5%;min-height:100vh;background:linear-gradient(135deg,var(--bgfrom),var(--bgmid) 60%,var(--bgto));color:var(--ink)}
.wrap{max-width:640px;margin:0 auto;text-align:center}
.logo,h1{color:var(--ink)}
h1{font-size:30px;margin-bottom:6px}
.sub{color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:28px}
.b{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:26px 10px;font:inherit;font-size:17px;font-weight:800;line-height:1.5;color:var(--ink);cursor:pointer;width:100%;margin:0;transition:.15s;box-shadow:0 10px 30px var(--shadow)}
.b:hover,.b:focus-visible{border-color:var(--blue);transform:translateY(-3px)}
.b span{display:block;font-size:28px;line-height:40px;height:40px;margin-bottom:8px}
.bar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:28px}
.back,.mode{display:inline-block;width:auto;margin:0;padding:8px 20px;border:1.5px solid var(--blue);border-radius:999px;background:var(--card);color:var(--blue);font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.back:hover,.back:focus-visible,.mode:hover,.mode:focus-visible{background:var(--blue);color:#fff}
.mock{background:var(--card);border-radius:16px;padding:24px;margin:34px auto 0;max-width:420px;box-shadow:0 20px 50px var(--shadow)}
.mock .l{height:10px;border-radius:6px;background:var(--line);margin-bottom:12px}
.mock .g{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.mock .g div{height:110px;border-radius:12px}
.mock .g div:nth-child(1){background:#fff7d6}
.mock .g div:nth-child(2){background:#dff6ff}
.mock .g div:nth-child(3){background:#dcebff}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);max-width:90vw;padding:12px 22px;border-radius:999px;background:var(--card);color:var(--ink);border:1.5px solid var(--blue);box-shadow:0 14px 34px var(--shadow);font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:30;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">أكاديمية مشكاة</div>
  <h1 id="ttl">الدرس</h1>
  <p class="sub" id="br">اختر القسم الذي تريده</p>

  <div class="grid">
    <button class="b" data-t="sum" data-n="الملخصات (الدروس)"><span>📘</span>الملخصات (الدروس)</button>
    <button class="b" data-t="ex" data-n="التمارين"><span>✏️</span>التمارين</button>
    <button class="b" data-t="cor" data-n="التصحيح"><span>✅</span>التصحيح</button>
    <button class="b" data-t="ser" data-n="سلاسل الميزان"><span>⚖️</span>سلاسل الميزان</button>
  </div>

  <div class="bar">
    <a class="back" href="index.html">← العودة للرئيسية</a>
    <button class="mode" id="mode" type="button">🌙 الوضع الليلي</button>
  </div>

  <div class="mock" aria-hidden="true">
    <div class="l" style="width:70%"></div>
    <div class="l"></div>
    <div class="l" style="width:85%"></div>
    <div class="g"><div></div><div></div><div></div></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const root=document.documentElement, modeBtn=document.getElementById('mode');
function paint(){
  modeBtn.textContent=root.getAttribute('data-theme')==='dark'?'☀️ الوضع النهاري':'🌙 الوضع الليلي';
}
paint();
modeBtn.onclick=()=>{
  const dark=root.getAttribute('data-theme')==='dark';
  if(dark){root.removeAttribute('data-theme');}else{root.setAttribute('data-theme','dark');}
  try{localStorage.setItem('mishkat_theme',dark?'light':'dark');}catch(e){}
  paint();
};

const ch=localStorage.getItem('mishkat_chapter')||'الدرس';
const sj=localStorage.getItem('mishkat_subject')||'';
const br=localStorage.getItem('mishkat_branch')||'';
document.getElementById('ttl').textContent=ch;
document.title=ch+' - أكاديمية مشكاة';
let sub=[];
if(sj) sub.push('مادة '+sj);
if(br) sub.push('شعبة '+br);
if(sub.length) document.getElementById('br').textContent=sub.join(' • ');

const toast=document.getElementById('toast');
let tm;
document.querySelectorAll('.b[data-t]').forEach(el=>{
  el.onclick=()=>{
    localStorage.setItem('mishkat_section',el.dataset.t);
    toast.textContent='قسم «'+el.dataset.n+'» قيد الإعداد، وسيُضاف محتواه قريباً ✨';
    toast.classList.add('on');
    clearTimeout(tm);
    tm=setTimeout(()=>toast.classList.remove('on'),2800);
  };
});
</script>
<script src="about.js"></script>
</body>
</html>
