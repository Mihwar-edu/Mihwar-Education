<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الملخصات - أكاديمية مشكاة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
<script>
try{if(localStorage.getItem('mishkat_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}
</script>
<style>
:root{--blue:#0a84ff;--ink:#101828;--muted:#667085;--card:#fff;--line:#eaeef3;--bgfrom:#e3f4ff;--bgmid:#f4fbff;--bgto:#fffbea;--shadow:rgba(10,132,255,.12);color-scheme:light;
--c1:#0a7ba0;--c2:#0f9bbd;--gold1:#ffc233;--gold2:#ff9f1c;--goldink:#4a3000;--cglow:rgba(6,120,150,.38);--cdeep:#086a8c}
:root[data-theme="dark"]{--ink:#f2f5f8;--muted:#9aa7b6;--card:#16212d;--line:#223041;--bgfrom:#0f2438;--bgmid:#0d141c;--bgto:#0d141c;--shadow:rgba(0,0,0,.35);color-scheme:dark}
body{display:block;padding:40px 5%;min-height:100vh;background:linear-gradient(135deg,var(--bgfrom),var(--bgmid) 60%,var(--bgto));color:var(--ink)}
.wrap{max-width:640px;margin:0 auto;text-align:center}
.logo,h1{color:var(--ink)}
h1{font-size:30px;margin-bottom:6px}
.sub{color:var(--muted)}

.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:26px auto 0;max-width:640px}
.vcard{display:flex;flex-direction:column;align-items:center;direction:rtl;text-align:center;padding:14px 10px 16px;border-radius:18px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 12px 28px var(--cglow);transition:transform .25s}
.vcard:hover{transform:translateY(-4px)}
.vcard::before{content:"";position:absolute;left:-40px;bottom:-60px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.12)}
.vcard>*{position:relative}
.vtag{display:inline-block;max-width:100%;background:linear-gradient(135deg,var(--gold1),var(--gold2));color:var(--goldink);padding:5px 10px;border-radius:999px;font-weight:800;font-size:11.5px;line-height:1.5;box-shadow:0 6px 14px rgba(255,159,28,.4)}
.vico{width:52px;height:52px;margin:10px auto 4px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center}
.vico svg{width:30px;height:30px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.vword{font-size:20px;font-weight:800;line-height:1.2;text-shadow:0 2px 4px rgba(0,60,80,.2)}
.vcard p{color:#fff;font-size:11.5px;line-height:1.55;margin:4px 0 12px;font-weight:500;text-shadow:0 1px 2px rgba(0,60,80,.25);flex:1}
.vact{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.vgo{display:inline-block;width:auto;margin:0;padding:7px 14px;border:0;border-radius:999px;background:#fff;color:var(--cdeep);font:inherit;font-size:12px;font-weight:800;cursor:pointer;text-decoration:none;box-shadow:0 8px 18px rgba(0,60,80,.2)}
.vgo:hover,.vgo:focus-visible{background:#e8fbff}
@media (min-width:600px){
  .vgrid{gap:18px}
  .vcard{padding:20px 18px 22px;border-radius:20px}
  .vtag{font-size:13.5px;padding:6px 14px}
  .vico{width:68px;height:68px;margin:14px auto 6px}
  .vico svg{width:38px;height:38px}
  .vword{font-size:26px}
  .vcard p{font-size:13.5px;margin:6px 0 14px}
  .vgo{padding:9px 24px;font-size:14px}
}

.bar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:30px}
.back,.mode{display:inline-block;width:auto;margin:0;padding:8px 20px;border:1.5px solid var(--blue);border-radius:999px;background:var(--card);color:var(--blue);font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.back:hover,.back:focus-visible,.mode:hover,.mode:focus-visible{background:var(--blue);color:#fff}
.mock{background:var(--card);border-radius:16px;padding:24px;margin:34px auto 0;max-width:420px;box-shadow:0 20px 50px var(--shadow)}
.mock .l{height:10px;border-radius:6px;background:var(--line);margin-bottom:12px}
.mock .g{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.mock .g div{height:110px;border-radius:12px}
.mock .g div:nth-child(1){background:#fff7d6}
.mock .g div:nth-child(2){background:#dff6ff}
.mock .g div:nth-child(3){background:#dcebff}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);max-width:90vw;padding:12px 22px;border-radius:999px;background:var(--card);color:var(--ink);border:1.5px solid var(--blue);box-shadow:0 14px 34px var(--shadow);font-weight:700;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:30;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.vcard{transition:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="i-book" viewBox="0 0 32 32"><path d="M16 7C13 5 9 4.5 5 5V24C9 23.5 13 24 16 26"/><path d="M16 7C19 5 23 4.5 27 5V24C23 23.5 19 24 16 26"/><path d="M16 7V26"/></symbol>
  <symbol id="i-user" viewBox="0 0 32 32"><circle cx="16" cy="11" r="5"/><path d="M6 27c0-5.5 4.5-9 10-9s10 3.5 10 9"/></symbol>
  <symbol id="i-trophy" viewBox="0 0 32 32"><path d="M9 5h14v6a7 7 0 0 1-14 0V5Z"/><path d="M9 7H5v2a4 4 0 0 0 4 4M23 7h4v2a4 4 0 0 1-4 4"/><path d="M16 18v5M11 27h10M13 23h6"/></symbol>
  <symbol id="i-star" viewBox="0 0 32 32"><path d="M16 4l3.5 7.2 7.9 1.1-5.7 5.5 1.4 7.8L16 21.9 8.9 25.6l1.4-7.8-5.7-5.5 7.9-1.1L16 4Z"/></symbol>
</svg>

<div class="wrap">
  <div class="logo">أكاديمية مشكاة</div>
  <h1 id="ttl">الملخصات</h1>
  <p class="sub" id="br">الملخصات</p>

  <div class="vgrid">

    <article class="vcard" data-k="platform">
      <span class="vtag">📘 ملخصات منصة مشكاة</span>
      <div class="vico"><svg viewBox="0 0 32 32" aria-hidden="true"><use href="#i-book"/></svg></div>
      <div class="vword">ملخصاتنا</div>
      <p>ملخصات خاصة بمنصة مشكاة</p>
      <div class="vact"><button class="vgo" type="button" data-n="ملخصات منصة مشكاة">تصفّح الملخصات ←</button></div>
    </article>

    <article class="vcard" data-k="teachers">
      <span class="vtag">👨‍🏫 ملخصات الأساتذة</span>
      <div class="vico"><svg viewBox="0 0 32 32" aria-hidden="true"><use href="#i-user"/></svg></div>
      <div class="vword">الأساتذة</div>
      <p>ملخصات أساتذة المادة</p>
      <div class="vact"><button class="vgo" type="button" data-n="ملخصات الأساتذة">تصفّح الملخصات ←</button></div>
    </article>

    <article class="vcard" data-k="top">
      <span class="vtag">🏆 ملخصات التلاميذ المتفوقين</span>
      <div class="vico"><svg viewBox="0 0 32 32" aria-hidden="true"><use href="#i-trophy"/></svg></div>
      <div class="vword">المتفوقون</div>
      <p>ملخصات تلاميذ متفوقين</p>
      <div class="vact"><button class="vgo" type="button" data-n="ملخصات التلاميذ المتفوقين">تصفّح الملخصات ←</button></div>
    </article>

    <article class="vcard" data-k="himma">
      <span class="vtag">🌟 ملخصات منصة همة</span>
      <div class="vico"><svg viewBox="0 0 32 32" aria-hidden="true"><use href="#i-star"/></svg></div>
      <div class="vword">همة</div>
      <p>ملخصات منصة همة</p>
      <div class="vact"><button class="vgo" type="button" data-n="ملخصات منصة همة">تصفّح الملخصات ←</button></div>
    </article>

  </div>

  <div class="bar">
    <a class="back" href="index.html">← العودة للرئيسية</a>
    <button class="mode" id="mode" type="button">🌙 الوضع الليلي</button>
  </div>

  <div class="mock" aria-hidden="true">
    <div class="l" style="width:70%"></div>
    <div class="l"></div>
    <div class="l" style="width:85%"></div>
    <div class="g"><div></div><div></div><div></div></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="summlinks.js"></script>
<script>
const root=document.documentElement, modeBtn=document.getElementById('mode');
function paint(){
  modeBtn.textContent=root.getAttribute('data-theme')==='dark'?'☀️ الوضع النهاري':'🌙 الوضع الليلي';
}
paint();
modeBtn.onclick=()=>{
  const dark=root.getAttribute('data-theme')==='dark';
  if(dark){root.removeAttribute('data-theme');}else{root.setAttribute('data-theme','dark');}
  try{localStorage.setItem('mishkat_theme',dark?'light':'dark');}catch(e){}
  paint();
};

const ch=localStorage.getItem('mishkat_chapter')||'';
const sj=localStorage.getItem('mishkat_subject')||'';
const br=localStorage.getItem('mishkat_branch')||'';
const title=ch||sj||'الملخصات';
document.getElementById('ttl').textContent=title;
document.title='ملخصات '+title+' - أكاديمية مشكاة';
let sub='الملخصات';
if(br) sub+=' • شعبة '+br;
document.getElementById('br').textContent=sub;

const cards=[].slice.call(document.querySelectorAll('.vcard'));
function setCard(card,key,tag,word,p,n,icon){
  card.dataset.k=key;
  card.querySelector('.vtag').textContent=tag;
  card.querySelector('.vword').textContent=word;
  card.querySelector('p').textContent=p;
  card.querySelector('use').setAttribute('href','#'+icon);
  const b=card.querySelector('button.vgo');
  b.dataset.n=n;
  b.textContent='تصفّح الملخصات ←';
}

if(sj==='العلوم الإسلامية'){
  /* العلوم الإسلامية: منصتنا ، كتاب بوسعادي ، همة ، كتاب شمس الدين */
  setCard(cards[1],'bousaadi','📖 ملخصات (كتاب) الأستاذة بوسعادي','بوسعادي','ملخصات كتاب الأستاذة بوسعادي','ملخصات (كتاب) الأستاذة بوسعادي','i-book');
  setCard(cards[2],'himma','🌟 ملخصات منصة همة','همة','ملخصات منصة همة','ملخصات منصة همة','i-star');
  setCard(cards[3],'shams','📖 ملخصات (كتاب) الأستاذ شمس الدين','شمس الدين','ملخصات كتاب الأستاذ شمس الدين','ملخصات (كتاب) الأستاذ شمس الدين','i-book');
}else if(sj==='العلوم'){
  /* العلوم: بطاقة ملخصات الأستاذة مروة خمالي */
  setCard(cards[1],'marwa','👩‍🏫 الأستاذة مروة خمالي','ملخصاتها','ملخصات الأستاذة مروة خمالي لعلوم الطبيعة والحياة','ملخصات الأستاذة مروة خمالي','i-user');
  cards[1].querySelector('button.vgo').textContent='فتح الموقع ←';
}

/* تحويل الأزرار إلى روابط عندما يتوفر رابط (الروابط في summlinks.js) */
cards.forEach(card=>{
  const u=(typeof SUMM!=='undefined'&&SUMM[card.dataset.k])||'';
  if(!u) return;
  const btn=card.querySelector('button.vgo');
  const a=document.createElement('a');
  a.className='vgo';
  a.href=u;
  a.target='_blank';
  a.rel='noopener';
  a.textContent=btn.textContent;
  btn.replaceWith(a);
});

/* الأزرار التي لا رابط لها بعد */
const toast=document.getElementById('toast');
let tm;
document.querySelectorAll('button.vgo').forEach(b=>{
  b.onclick=()=>{
    toast.textContent='قسم «'+b.dataset.n+'» قيد الإعداد، وسيُضاف قريباً ✨';
    toast.classList.add('on');
    clearTimeout(tm);
    tm=setTimeout(()=>toast.classList.remove('on'),2800);
  };
});
</script>
<script src="about.js"></script>
</body>
</html>
