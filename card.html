<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بطاقة الطالب - أكاديمية مشكاة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
<script>
try{if(localStorage.getItem('mishkat_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}
</script>
<style>
:root{--blue:#0a84ff;--ink:#101828;--muted:#667085;--card:#fff;--line:#eaeef3;--bgfrom:#e3f4ff;--bgmid:#f4fbff;--bgto:#fffbea;--shadow:rgba(10,132,255,.12);color-scheme:light;
--c1:#0a7ba0;--c2:#0f9bbd;--c3:#0b8cae;--gold1:#ffc233;--gold2:#ff9f1c;--goldink:#4a3000}
:root[data-theme="dark"]{--ink:#f2f5f8;--muted:#9aa7b6;--card:#16212d;--line:#223041;--bgfrom:#0f2438;--bgmid:#0d141c;--bgto:#0d141c;--shadow:rgba(0,0,0,.35);color-scheme:dark}
body{display:block;padding:40px 5%;min-height:100vh;background:linear-gradient(135deg,var(--bgfrom),var(--bgmid) 60%,var(--bgto));color:var(--ink)}
.wrap{max-width:640px;margin:0 auto;text-align:center}
.logo,h1{color:var(--ink)}
h1{font-size:30px;margin-bottom:6px}
.sub{color:var(--muted)}

/* المشهد ثلاثي الأبعاد */
.scene{width:min(380px,92vw);margin:30px auto 0;perspective:1200px;container-type:inline-size}
@media (min-width:900px){.scene{width:min(460px,92vw)}}
.float{transform-style:preserve-3d;animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) rotateY(-7deg) rotateX(2deg)}50%{transform:translateY(-10px) rotateY(7deg) rotateX(-2deg)}}
.tilt{transform-style:preserve-3d;transition:transform .15s ease-out;animation:intro 1.6s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes intro{from{transform:rotateY(-540deg) scale(.5);opacity:0}to{transform:none;opacity:1}}
.flip{position:relative;width:100%;aspect-ratio:85.6/54;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.2,.8,.2,1);cursor:pointer;outline-offset:6px}
.flip.is-flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:4.2cqw;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;box-shadow:0 2.5cqw 6cqw rgba(6,120,150,.45);text-align:right}

/* الوجه الأمامي */
.front{background:linear-gradient(135deg,var(--c1) 0%,var(--c2) 55%,var(--c3) 100%);color:#fff;padding:5cqw 6cqw;display:flex;flex-direction:column;justify-content:space-between}
.front::before{content:"";position:absolute;width:60cqw;height:60cqw;border-radius:50%;background:rgba(255,255,255,.12);left:-20cqw;bottom:-30cqw}
.front::after{content:"";position:absolute;width:30cqw;height:30cqw;border-radius:50%;background:rgba(255,194,51,.28);right:-9cqw;top:-12cqw}
.front>*:not(.sheen){position:relative;z-index:1}
.sheen{position:absolute;top:0;bottom:0;width:18%;left:-30%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-18deg);animation:sheen 5s ease-in-out 1.8s infinite;pointer-events:none;z-index:2}
@keyframes sheen{0%{left:-30%}35%,100%{left:130%}}
.row1{display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:2.4cqw;font-weight:800;font-size:4.2cqw}
.lg{width:8cqw;height:8cqw;border-radius:50%;background:linear-gradient(135deg,var(--gold1),var(--gold2));color:var(--goldink);display:grid;place-items:center;font-weight:800;font-size:4.6cqw}
.kind{font-size:3cqw;font-weight:800;background:rgba(255,255,255,.22);padding:.8cqw 3cqw;border-radius:999px}
.mid{display:flex;gap:5cqw;align-items:center}
.info{flex:1;display:grid;gap:2.4cqw;min-width:0}
.lab{display:block;font-size:2.5cqw;opacity:.85;line-height:1.3}
.val{display:block;font-size:5.2cqw;font-weight:800;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.photo{flex:none;width:25cqw;aspect-ratio:3/4;border-radius:2.4cqw;overflow:hidden;border:.7cqw solid rgba(255,255,255,.9);background:#e6f7fc;box-shadow:0 1.5cqw 3cqw rgba(0,60,80,.3)}
.photo img,.photo svg{width:100%;height:100%;object-fit:cover;display:block}
.row3{display:flex;justify-content:space-between;align-items:center}
.code{direction:ltr;font-family:'Courier New',ui-monospace,monospace;font-weight:800;letter-spacing:.35cqw;font-size:4.4cqw;background:rgba(255,255,255,.22);padding:.9cqw 3cqw;border-radius:999px}
.chip{width:9cqw;height:7cqw;border-radius:1.4cqw;background:linear-gradient(135deg,var(--gold1),var(--gold2));position:relative;box-shadow:inset 0 0 0 .3cqw rgba(74,48,0,.35)}
.chip::after{content:"";position:absolute;left:0;right:0;top:50%;height:.3cqw;background:rgba(74,48,0,.35)}

/* الوجه الخلفي */
.back{transform:rotateY(180deg);background:linear-gradient(135deg,#f8fdff,#e1f6fc);color:#0b3c4d}
.stripe{position:absolute;top:8cqw;left:0;right:0;height:10cqw;background:linear-gradient(90deg,#0a4d63,#0b6786,#0a4d63)}
.binfo{position:absolute;top:22cqw;left:6cqw;right:6cqw;display:grid;gap:2.2cqw}
.brow{display:flex;align-items:center;gap:3cqw;background:rgba(10,123,160,.1);border-radius:2cqw;padding:1.4cqw 2.8cqw}
.brow .lab{color:#2a6b80;opacity:1;flex:none}
.brow .v{direction:ltr;flex:1;min-width:0;font-weight:800;font-size:3.5cqw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eye{flex:none;width:6.5cqw;height:6.5cqw;margin:0;padding:0;border:0;border-radius:50%;background:#0a7ba0;color:#fff;font-size:3.2cqw;cursor:pointer;display:grid;place-items:center}
.bcode{position:absolute;left:6cqw;right:6cqw;bottom:4cqw;display:flex;justify-content:space-between;align-items:flex-end;gap:4cqw}
.hint{font-size:2.3cqw;color:#2a6b80;line-height:1.6}
.bars{flex:none;height:7cqw;width:32cqw;background:repeating-linear-gradient(90deg,#0b3c4d 0 .5cqw,transparent .5cqw 1cqw,#0b3c4d 1cqw 2cqw,transparent 2cqw 2.4cqw,#0b3c4d 2.4cqw 2.9cqw,transparent 2.9cqw 4cqw)}

/* الأزرار */
.acts{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:30px}
.act{display:inline-block;width:auto;margin:0;padding:9px 18px;border:1.5px solid var(--blue);border-radius:999px;background:var(--card);color:var(--blue);font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.act:hover,.act:focus-visible{background:var(--blue);color:#fff}
.cta{display:inline-block;margin-top:22px;padding:13px 34px;border-radius:999px;background:var(--blue);color:#fff;font-weight:800;font-size:16px;box-shadow:0 12px 26px rgba(10,132,255,.35)}
.note{margin:16px auto 0;max-width:420px;font-size:13.5px;color:var(--muted)}
.bar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:26px}
.back-l,.mode{display:inline-block;width:auto;margin:0;padding:8px 20px;border:1.5px solid var(--blue);border-radius:999px;background:var(--card);color:var(--blue);font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.back-l:hover,.mode:hover{background:var(--blue);color:#fff}
@media (prefers-reduced-motion:reduce){.float,.tilt,.sheen{animation:none}.flip{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">أكاديمية مشكاة</div>
  <h1>🎉 بطاقتك جاهزة</h1>
  <p class="sub">هذه بطاقة طالب منصة مشكاة، وكودها مفتاح دخولك إلى حسابك</p>

  <div class="scene" id="scene">
    <div class="float"><div class="tilt" id="tilt">
      <div class="flip" id="flip" tabindex="0" role="button" aria-label="اقلب البطاقة">

        <div class="face front">
          <span class="sheen"></span>
          <div class="row1">
            <div class="brand"><span class="lg">م</span>أكاديمية مشكاة</div>
            <span class="kind" id="kind">بطاقة طالب</span>
          </div>
          <div class="mid">
            <div class="info">
              <div><span class="lab">الاسم</span><span class="val" id="fn"></span></div>
              <div><span class="lab">اللقب</span><span class="val" id="ln"></span></div>
            </div>
            <div class="photo" id="photo">
              <svg viewBox="0 0 90 120" aria-hidden="true"><defs><linearGradient id="av" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dff6ff"/><stop offset="1" stop-color="#9fdcf0"/></linearGradient></defs><rect width="90" height="120" fill="url(#av)"/><circle cx="45" cy="46" r="17" fill="#fff"/><path d="M12 120C12 90 28 76 45 76S78 90 78 120Z" fill="#fff"/></svg>
            </div>
          </div>
          <div class="row3">
            <span class="code" id="code"></span>
            <span class="chip"></span>
          </div>
        </div>

        <div class="face back">
          <div class="stripe"></div>
          <div class="binfo">
            <div class="brow"><span class="lab">البريد الإلكتروني</span><span class="v" id="em"></span></div>
            <div class="brow"><span class="lab">كلمة المرور</span><span class="v" id="pw"></span><button class="eye" id="eye" type="button" aria-label="إظهار كلمة المرور">👁</button></div>
          </div>
          <div class="bcode"><span class="hint" id="hint"></span><span class="bars"></span></div>
        </div>

      </div>
    </div></div>
  </div>

  <div class="acts">
    <button class="act" id="flipB" type="button">🔄 اقلب البطاقة</button>
    <button class="act" id="copyB" type="button">📋 انسخ الكود</button>
    <label class="act" for="pic">🖼️ غيّر الصورة</label>
    <input type="file" id="pic" accept="image/*" hidden>
  </div>

  <a class="cta" href="dashboard.html">متابعة إلى حسابي ←</a>
  <p class="note">احتفظ بكود بطاقتك في مكان آمن، ولا تشاركه مع أحد، فبه تدخل إلى حسابك من صفحة تسجيل الدخول.</p>

  <div class="bar">
    <a class="back-l" href="index.html">← العودة للرئيسية</a>
    <button class="mode" id="mode" type="button">🌙 الوضع الليلي</button>
  </div>
</div>

<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  var root=document.documentElement, reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* الوضع الليلي */
  var modeBtn=$('mode');
  function paint(){modeBtn.textContent=root.getAttribute('data-theme')==='dark'?'☀️ الوضع النهاري':'🌙 الوضع الليلي';}
  paint();
  modeBtn.onclick=function(){
    var dark=root.getAttribute('data-theme')==='dark';
    if(dark){root.removeAttribute('data-theme');}else{root.setAttribute('data-theme','dark');}
    try{localStorage.setItem('mishkat_theme',dark?'light':'dark');}catch(e){}
    paint();
  };

  /* بيانات الطالب */
  var users=JSON.parse(localStorage.getItem('mishkat_users')||'[]');
  var email=localStorage.getItem('mishkat_session');
  var u=users.find(function(x){return x.email===email;});
  if(!u){location.href='login.html';return;}
  function save(){localStorage.setItem('mishkat_users',JSON.stringify(users));}

  function genCode(){
    var A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    for(;;){
      var b=new Uint8Array(8); crypto.getRandomValues(b);
      var s=''; for(var i=0;i<8;i++) s+=A[b[i]%A.length];
      var c='MSH-'+s.slice(0,4)+'-'+s.slice(4);
      if(!users.some(function(x){return x.code===c;})) return c;
    }
  }
  var changed=false;
  if(!u.code){u.code=genCode();changed=true;}
  if(!u.first){var parts=(u.name||'').trim().split(/\s+/);u.first=parts[0]||'';u.last=parts.slice(1).join(' ');changed=true;}
  if(!u.created){u.created=Date.now();changed=true;}
  if(changed) save();

  $('fn').textContent=u.first||'—';
  $('ln').textContent=u.last||'—';
  $('code').textContent=u.code;
  $('em').textContent=u.email;
  $('kind').textContent=u.role==='teacher'?'بطاقة معلم':'بطاقة طالب';
  var d=new Date(u.created), p2=function(n){return (n<10?'0':'')+n;};
  $('hint').textContent='أدخل كود هذه البطاقة في صفحة تسجيل الدخول للوصول إلى حسابك. صدرت في '+p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+d.getFullYear();

  /* كلمة المرور */
  var shown=false;
  function drawPw(){
    $('pw').textContent=shown?u.pass:'\u2022'.repeat(Math.min((u.pass||'').length,12)||8);
    $('eye').textContent=shown?'🙈':'👁';
  }
  drawPw();
  $('eye').addEventListener('click',function(e){e.stopPropagation();shown=!shown;drawPw();});

  /* الصورة */
  function showPhoto(){
    if(u.photo){$('photo').innerHTML='<img alt="صورة الطالب" src="'+u.photo+'">';}
  }
  showPhoto();
  $('pic').addEventListener('change',function(){
    var f=this.files[0]; if(!f) return;
    var rd=new FileReader();
    rd.onload=function(){
      var im=new Image();
      im.onload=function(){
        var c=document.createElement('canvas'); c.width=240; c.height=320;
        var ctx=c.getContext('2d');
        var r=Math.max(240/im.width,320/im.height), w=im.width*r, h=im.height*r;
        ctx.drawImage(im,(240-w)/2,(320-h)/2,w,h);
        u.photo=c.toDataURL('image/jpeg',.82);
        save(); showPhoto();
      };
      im.src=rd.result;
    };
    rd.readAsDataURL(f);
  });

  /* قلب البطاقة */
  var flip=$('flip');
  function toggle(){flip.classList.toggle('is-flipped');}
  flip.addEventListener('click',toggle);
  flip.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();}});
  $('flipB').addEventListener('click',toggle);

  /* ميلان البطاقة مع الإصبع أو الماوس */
  if(!reduce){
    var scene=$('scene'), tilt=$('tilt');
    scene.addEventListener('pointermove',function(e){
      var r=scene.getBoundingClientRect();
      var px=(e.clientX-r.left)/r.width-.5, py=(e.clientY-r.top)/r.height-.5;
      tilt.style.transform='rotateY('+(px*18)+'deg) rotateX('+(-py*14)+'deg)';
    });
    scene.addEventListener('pointerleave',function(){tilt.style.transform='';});
  }

  /* نسخ الكود */
  var copyB=$('copyB');
  copyB.addEventListener('click',function(){
    function ok(){copyB.textContent='✅ تم النسخ';setTimeout(function(){copyB.textContent='📋 انسخ الكود';},1600);}
    function fallback(){
      var ta=document.createElement('textarea'); ta.value=u.code; document.body.appendChild(ta); ta.select();
      try{document.execCommand('copy');ok();}catch(e){}
      document.body.removeChild(ta);
    }
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(u.code).then(ok,fallback);}
    else{fallback();}
  });
})();
</script>
</body>
</html>
